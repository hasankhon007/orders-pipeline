version: 2

models:
  - name: daily_revenue
    description: Daily order counts and revenue in a single reporting currency.

    columns:
      - name: order_date
        description: UTC business date.
        tests:
          - unique
          - not_null

      - name: order_count
        tests:
          - not_null

      - name: total_revenue
        tests:
          - not_null